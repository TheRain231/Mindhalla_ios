name: Synapps
options:
  bundleIdPrefix: com.mindhalla.Synapps
  xcodeVersion: "16.4"
  deploymentTarget:
    iOS: "17"
packages:
  AnyCodable:
    url: https://github.com/Flight-School/AnyCodable
    from: 0.6.0
settings:
  GENERATE_INFOPLIST_FILE: NO
targets:
    Synapps:
        platform: iOS
        type: application
        deploymentTarget: "17"
        sources: ["Synapps"]
        settings:
          base:
            INFOPLIST_FILE: "Synapps/Info.plist"
        dependencies:
          - package: AnyCodable
        

